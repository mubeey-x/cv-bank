name: cv_bank
description: "Private CV bank with categories, employment tracking and stats."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management and dependency injection
  flutter_riverpod:

  # Functional error handling, the Either<Failure, T> in every repository
  fpdart:

  # Backend: auth, postgres, storage
  supabase_flutter:

  # Navigation
  go_router:

  # Date formatting on the dashboard
  intl:

  # Intake: pick a CV file or photograph a paper one
  file_picker:
  image_picker:
  flutter_svg: ^2.3.0

  # Document viewer and file handling
  pdfrx:
  path:
  path_provider:
  open_filex:
  share_plus:

  # Dashboard charts
  fl_chart:

  # Offline cache for the people list
  sqflite:

  # Connectivity check in the repository layer
  connectivity_plus:
  internet_connection_checker_plus:
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail:

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
